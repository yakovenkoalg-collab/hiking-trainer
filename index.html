<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1b4332" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Горный тренер">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Горный тренер</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#2d6a4f;--primary-light:#52b788;--primary-dark:#1b4332;
  --bg:#f0f2f5;--card:#fff;--text:#1a1a2e;--text-muted:#6b7280;
  --border:#e5e7eb;--success:#40916c;--danger:#e76f51;
  --phase1:#2d6a4f;--phase2:#e76f51;--phase3:#264653;--phase4:#e9c46a;
  --radius:14px;--shadow:0 2px 12px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){:root{
  --primary:#40916c;--primary-light:#52b788;--primary-dark:#1b4332;
  --bg:#0f1117;--card:#1a1c25;--text:#e2e4e9;--text-muted:#8b8fa3;
  --border:#2a2d3a;--success:#52b788;--danger:#f4845f;
  --shadow:0 2px 12px rgba(0,0,0,.3);
}}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:480px;margin:0 auto;padding:0 0 80px}

/* Header */
.header{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;padding:20px 16px 16px;position:sticky;top:0;z-index:100}
.header h1{font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:8px}
.header-sub{font-size:.8rem;opacity:.8;margin-top:4px}
.progress-bar-wrap{background:rgba(255,255,255,.2);border-radius:10px;height:8px;margin-top:10px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--primary-light);border-radius:10px;transition:width .4s ease}
.back-btn{background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;padding:4px 8px 4px 0;line-height:1}

/* Phase section */
.phase-section{padding:16px}
.phase-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.phase-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.phase-name{font-size:1rem;font-weight:700}
.phase-desc{font-size:.78rem;color:var(--text-muted);margin-bottom:12px;line-height:1.4}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;cursor:pointer;transition:transform .15s;-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(.98)}
.card-body{padding:14px 16px}
.card-top{display:flex;justify-content:space-between;align-items:center}
.card-title{font-size:.95rem;font-weight:600}
.card-badge{font-size:.7rem;padding:3px 8px;border-radius:20px;font-weight:600;color:#fff}
.card-meta{font-size:.78rem;color:var(--text-muted);margin-top:4px}
.card-progress{height:4px;background:var(--border);border-radius:4px;margin-top:8px;overflow:hidden}
.card-progress-fill{height:100%;border-radius:4px;transition:width .3s}

/* Week view */
.week-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.week-nav-btn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 16px;font-size:.85rem;cursor:pointer;font-weight:600}
.week-nav-btn:disabled{opacity:.3;cursor:default}
.week-nav-title{font-size:1rem;font-weight:700}
.day-cards{padding:0 16px}
.day-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;cursor:pointer;transition:transform .15s;-webkit-tap-highlight-color:transparent}
.day-card:active{transform:scale(.98)}
.day-card-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.day-card-day{font-size:1.1rem;font-weight:700}
.day-card-focus{font-size:.82rem;color:var(--text-muted);margin-top:2px}
.day-card-status{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:20px}
.day-card-exercises{font-size:.78rem;color:var(--text-muted);padding:0 16px 12px}

/* Day view (workout) */
.day-header{padding:16px;padding-top:8px}
.day-title{font-size:1.15rem;font-weight:700}
.day-focus-tag{display:inline-block;font-size:.78rem;padding:3px 10px;border-radius:20px;margin-top:6px;font-weight:600}
.block{margin:0 12px 14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.block-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.block-name{font-size:.88rem;font-weight:700}
.block-info{font-size:.72rem;color:var(--text-muted)}
.block-chevron{font-size:1.1rem;color:var(--text-muted);transition:transform .2s}
.block-chevron.open{transform:rotate(180deg)}
.block-content{max-height:0;overflow:hidden;transition:max-height .3s ease}
.block-content.open{max-height:2000px}
.exercise{display:flex;align-items:flex-start;gap:12px;padding:10px 16px;border-top:1px solid var(--border)}
.exercise.done{opacity:.5}
.ex-check{width:28px;height:28px;border-radius:8px;border:2px solid var(--border);background:var(--card);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:2px;-webkit-tap-highlight-color:transparent}
.ex-check.checked{background:var(--success);border-color:var(--success)}
.ex-check.checked::after{content:'✓';color:#fff;font-size:.9rem;font-weight:700}
.ex-img{width:56px;height:56px;border-radius:10px;background:var(--bg);flex-shrink:0;overflow:hidden;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ex-img img{width:100%;height:100%;object-fit:cover;transition:opacity .3s}
.ex-img svg{width:40px;height:40px;margin:8px}
.ex-body{flex:1;min-width:0}
.ex-name{font-size:.88rem;font-weight:600;line-height:1.3}
.ex-params{font-size:.78rem;color:var(--text-muted);margin-top:2px;line-height:1.3}
.ex-notes{font-size:.75rem;color:var(--danger);margin-top:2px;font-style:italic}
.ex-rest-btn{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:5px 10px;font-size:.72rem;font-weight:600;cursor:pointer;margin-top:4px;-webkit-tap-highlight-color:transparent}

/* Timer overlay */
.timer-overlay{position:fixed;bottom:0;left:0;right:0;z-index:200;display:none}
.timer-overlay.active{display:block}
.timer-bar{max-width:480px;margin:0 auto;background:var(--primary-dark);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.timer-text{font-size:1.1rem;font-weight:700}
.timer-label{font-size:.78rem;opacity:.8}
.timer-close{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:10px;padding:8px 14px;font-size:.85rem;cursor:pointer;font-weight:600}
.timer-progress{height:4px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:8px;max-width:480px;margin-left:auto;margin-right:auto}
.timer-progress-fill{height:100%;background:var(--primary-light);border-radius:4px;transition:width 1s linear}

/* Complete all */
.complete-all-wrap{padding:0 12px 8px}
.complete-all-btn{width:100%;padding:14px;border:none;border-radius:var(--radius);font-size:.9rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .2s}
.complete-all-btn.do{background:var(--success);color:#fff}
.complete-all-btn.undo{background:var(--border);color:var(--text-muted)}

/* Reset btn */
.reset-wrap{padding:20px 16px;text-align:center}
.reset-btn{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:10px;padding:10px 20px;font-size:.8rem;cursor:pointer}

/* Calendar export */
.cal-wrap{padding:0 16px 8px}
.cal-btn{width:100%;padding:12px;border:2px solid var(--primary);border-radius:var(--radius);background:var(--card);color:var(--primary);font-size:.85rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent;transition:all .2s}
.cal-btn:active{background:var(--primary);color:#fff}
.cal-date-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.cal-date-row label{font-size:.78rem;color:var(--text-muted);font-weight:600;white-space:nowrap}
.cal-date-row input{flex:1;padding:8px 10px;border:2px solid var(--border);border-radius:var(--radius);font-size:.85rem;background:var(--card);color:var(--text);font-family:inherit}

/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.lightbox.active{display:flex}
.lightbox-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer;z-index:301;padding:8px;line-height:1}
.lightbox-title{color:#fff;font-size:1rem;font-weight:600;text-align:center;padding:0 48px;margin-bottom:12px;max-width:400px;line-height:1.4}
.lightbox-imgs{display:flex;gap:8px;padding:0 12px;max-width:100%;justify-content:center}
.lightbox-imgs img{max-width:48%;max-height:60dvh;border-radius:12px;object-fit:contain;background:#1a1a2e}
.lightbox-hint{color:rgba(255,255,255,.5);font-size:.75rem;margin-top:12px;text-align:center}
.lightbox-toggle{display:flex;gap:12px;margin-top:16px}
.lightbox-toggle button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:10px 20px;font-size:.85rem;cursor:pointer;font-weight:600;transition:background .2s}
.lightbox-toggle button.active{background:var(--primary);border-color:var(--primary)}

/* Venue selector */
.venue-wrap{padding:14px 16px 0}
.venue-label{font-size:.82rem;color:var(--text-muted);margin-bottom:8px;font-weight:600}
.venue-tabs{display:flex;gap:6px}
.venue-tab{flex:1;padding:10px 6px 8px;border:2px solid var(--border);border-radius:var(--radius);background:var(--card);font-size:.78rem;font-weight:600;cursor:pointer;text-align:center;transition:all .2s;-webkit-tap-highlight-color:transparent;line-height:1.3}
.venue-tab.active{border-color:var(--primary);background:var(--primary);color:#fff}
.venue-tab .venue-icon{font-size:1.2rem;display:block;margin-bottom:2px}
.venue-equip{font-size:.72rem;color:var(--text-muted);padding:8px 16px 0;line-height:1.4;font-style:italic}
.venue-badge{display:inline-block;font-size:.68rem;padding:2px 8px;border-radius:10px;font-weight:600;margin-left:8px;vertical-align:middle}
.venue-override{font-size:.65rem;color:var(--primary-light);margin-top:2px;font-style:italic}

/* Profile selector */
.profile-wrap{padding:0 16px 8px}
.profile-label{font-size:.82rem;color:var(--text-muted);margin-bottom:8px;font-weight:600}
.profile-cards{display:flex;flex-direction:column;gap:6px}
.profile-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--border);border-radius:var(--radius);background:var(--card);cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.profile-card.active{border-color:var(--primary);background:linear-gradient(135deg,rgba(79,70,229,.08),rgba(79,70,229,.02))}
.profile-card .pf-icon{font-size:1.4rem;width:32px;text-align:center;flex-shrink:0}
.profile-card .pf-info{flex:1;min-width:0}
.profile-card .pf-name{font-size:.85rem;font-weight:700;color:var(--text)}
.profile-card .pf-desc{font-size:.7rem;color:var(--text-muted);line-height:1.3;margin-top:1px}
.profile-card .pf-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.profile-card.active .pf-check{border-color:var(--primary);background:var(--primary);color:#fff;font-size:.7rem}

/* Next training widget */
.next-train{margin:0 16px 12px;padding:14px 16px;background:linear-gradient(135deg,var(--primary-dark),var(--primary));border-radius:var(--radius);color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.next-train:active{transform:scale(.98)}
.next-train-label{font-size:.72rem;opacity:.7;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.next-train-title{font-size:1rem;font-weight:700;margin-top:4px}
.next-train-sub{font-size:.78rem;opacity:.8;margin-top:2px}

/* Hike countdown */
.countdown-wrap{padding:0 16px 8px}
.countdown-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.countdown-top{display:flex;align-items:center;justify-content:space-between}
.countdown-label{font-size:.82rem;font-weight:600;color:var(--text-muted)}
.countdown-date input{padding:6px 8px;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:var(--card);color:var(--text);font-family:inherit}
.countdown-num{font-size:2rem;font-weight:800;color:var(--primary);margin-top:8px}
.countdown-detail{font-size:.78rem;color:var(--text-muted);margin-top:2px}

/* Streak */
.streak-badge{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;color:var(--danger);margin-left:8px}

/* Training notes */
.notes-wrap{padding:8px 12px 0}
.notes-area{width:100%;min-height:60px;padding:10px;border:2px solid var(--border);border-radius:var(--radius);font-size:.82rem;font-family:inherit;background:var(--card);color:var(--text);resize:vertical;line-height:1.4}
.notes-area::placeholder{color:var(--text-muted)}
.notes-label{font-size:.78rem;color:var(--text-muted);font-weight:600;margin-bottom:6px}

/* History */
.history-item{font-size:.78rem;color:var(--text-muted);padding:4px 0;display:flex;justify-content:space-between}
.history-wrap{padding:8px 16px}
.history-title{font-size:.82rem;font-weight:600;color:var(--text-muted);margin-bottom:6px}

/* Readiness test */
.test-wrap{margin:0 12px 14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;padding:14px 16px}
.test-title{font-size:.92rem;font-weight:700;margin-bottom:8px}
.test-item{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.82rem}
.test-item input[type=checkbox]{width:20px;height:20px;accent-color:var(--success)}
.test-result{font-size:.82rem;font-weight:600;margin-top:10px;padding:10px;border-radius:8px;text-align:center}

/* Week skip */
.skip-wrap{padding:0 16px 12px}
.skip-btn{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:10px;padding:8px 14px;font-size:.78rem;cursor:pointer;font-weight:600}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .25s ease}
</style>
</head>
<body>
<div id="app"></div>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <div class="lightbox-title" id="lbTitle"></div>
  <div class="lightbox-imgs" id="lbImgs"></div>
  <div class="lightbox-toggle" id="lbToggle">
    <button class="active" onclick="showLbView('both')">Оба</button>
    <button onclick="showLbView('start')">Старт</button>
    <button onclick="showLbView('end')">Финиш</button>
  </div>
  <div class="lightbox-hint">Две фотографии: начальная и конечная позиция</div>
</div>

<div class="timer-overlay" id="timer">
  <div class="timer-progress"><div class="timer-progress-fill" id="timerProgressFill"></div></div>
  <div class="timer-bar">
    <div>
      <div class="timer-label" id="timerLabel">Отдых</div>
      <div class="timer-text" id="timerText">0:00</div>
    </div>
    <button class="timer-close" onclick="stopTimer()">Стоп</button>
  </div>
</div>

<script>
// ============ TRAINING DATA ============
const PHASES = [
  {name:"Базовая сила",color:"var(--phase1)",desc:"Нарастить силовую выносливость ног, начать аэробную базу"},
  {name:"Силовая выносливость",color:"var(--phase2)",desc:"Больше повторений, меньше отдыха, эксцентрика для спусков"},
  {name:"Горная специфика",color:"var(--phase3)",desc:"Нагрузки максимально близкие к реальным условиям похода"},
  {name:"Пиковая + сужение",color:"var(--phase4)",desc:"Недели 13-14 пиковая нагрузка, 15-16 снижение объёма (taper)"}
];

function b(type,name,rounds,rest,exercises){return{type,name,rounds:rounds||1,rest:rest||0,exercises}}
function e(name,params,notes){return{name,params:params||'',notes:notes||''}}

const PROGRAM = [
  // ====== PHASE 1: weeks 1-4 ======
  // Week 1
  [
    // Вторник — Сила ног
    {day:"Вт",focus:"Сила ног + кор",blocks:[
      b("warmup","Разминка",1,0,[
        e("Эллипс","10 мин, лёгкий темп"),
        e("Суставная разминка","5 мин"),
        e("Раскатка на валике","5 мин, ноги + спина")
      ]),
      b("circuit","Круг 1",3,150,[
        e("Зашагивания на коробку 50-60 см с гантелями","10-12 кг, по 12 на ногу"),
        e("Румынская тяга со штангой","30 кг, 15 раз"),
        e("Латеральные выпады с гантелями","8 кг, по 10 на сторону"),
        e("Альпинист","20 пар")
      ]),
      b("sets","Сет 1",3,120,[
        e("Жим ногами","80 кг, 15-20 раз"),
        e("Сгибание голени сидя","30 кг, 15 раз")
      ]),
      b("sets","Сет 2",3,120,[
        e("Болгарские приседания в Смите","20 кг доп. дисков, по 12 на сторону"),
        e("Разгибание голени сидя","35 кг, 15 раз")
      ]),
      b("circuit","Кор-финишер",3,60,[
        e("Планка","45 сек"),
        e("Боковая планка","по 30 сек на сторону"),
        e("Гиперэкстензия с диском","10 кг, 15 раз")
      ]),
      b("cooldown","Заминка",1,0,[
        e("Растяжка ног","10 мин, квадрицепсы + задняя поверхность"),
        e("Раскатка на валике","5 мин")
      ])
    ]},
    // Четверг — Верх тела
    {day:"Чт",focus:"Верх тела + функционалка",blocks:[
      b("warmup","Разминка",1,0,[
        e("Аэробайк","3 мин, 200 Ватт"),
        e("Суставная разминка","5 мин"),
        e("Раскатка на валике","5 мин")
      ]),
      b("circuit","Круг 1",3,120,[
        e("Жим штанги на горизонтальной скамье","30 кг, 20 раз"),
        e("Подтягивания в гравитроне","20 кг противовес, 15 раз"),
        e("Скручивания с диском","10 кг, 20-25 раз"),
        e("Пуловер с гантелью","10-12 кг, 12 раз")
      ]),
      b("sets","Сет 1",3,120,[
        e("Сведение рук в тренажёре сидя","15 кг, 12-15 раз"),
        e("Сгибание рук на бицепс со штангой","15-20 кг, 12-15 раз")
      ]),
      b("sets","Сет 2",3,90,[
        e("Тяга к подбородку с косичкой","20 кг, 15 раз","Фиксируем сведение лопаток!"),
        e("Гиперэкстензия","собств. вес, 15-20 раз")
      ]),
      b("cooldown","Заминка",1,0,[
        e("Эллипс","10 мин, свободный режим"),
        e("Растяжка","5 мин")
      ])
    ]},
    // Суббота — Длительное кардио
    {day:"Сб",focus:"Длительное кардио",blocks:[
      b("warmup","Разминка",1,0,[
        e("Суставная разминка","5 мин")
      ]),
      b("circuit","Кардио-блок",1,0,[
        e("Дорожка с уклоном 8-10%","30 мин, 5-6 км/ч, темп разговорный","ЧСС 130-150"),
        e("Каждые 10 мин — ускорение","2 мин на 7-8 км/ч")
      ]),
      b("circuit","Ноги после кардио",2,90,[
        e("Полуприседы на одной ноге на полусфере","по 10 на каждую","Удерживать баланс!"),
        e("Приседания с собственным весом","20 раз"),
        e("Подъёмы на носки","25 раз")
      ]),
      b("cooldown","Заминка",1,0,[
        e("Растяжка","10 мин"),
        e("Раскатка IT-band","5 мин, валик по внешней стороне бедра")
      ])
    ]}
  ],
  // Week 2
  [
    {day:"Вт",focus:"Сила ног + кор",blocks:[
      b("warmup","Разминка",1,0,[
        e("Эллипс","10 мин"),
        e("Суставная разминка + валик","8 мин")
      ]),

// ============ STATE ============
const STORAGE_KEY = 'hiking-trainer-v1';
let state = {
  screen: 'program', weekIdx: 0, dayIdx: 0,
  completed: {},   // {"w0d0b0e0": true, ...}
  openBlocks: {},
  profile: 'hike',
  venues: {},      // per-day overrides
  hikeDate: '',    // ISO date string for countdown
  notes: {},       // {"w0d0": "text", ...}
  history: {},     // {"w0d0": {date: "2026-03-15", startMs: 123, endMs: 456}, ...}
  weekOffset: 0    // number of weeks shifted (for skip)
};

const PERSIST_KEYS = ['completed','weekIdx','profile','venues','hikeDate','notes','history','weekOffset'];

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s) { PERSIST_KEYS.forEach(k => { if (s[k] != null) state[k] = s[k]; }); }
  } catch(e) {}
}

function saveState() {
  const o = {};
  PERSIST_KEYS.forEach(k => o[k] = state[k]);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(o));
}

function exId(w, d, bIdx, eIdx) { return `w${w}d${d}b${bIdx}e${eIdx}`; }

function isExDone(id) { return !!state.completed[id]; }

function toggleEx(id) {
  if (state.completed[id]) delete state.completed[id];
  else state.completed[id] = true;
  // Track history timing
  const m = id.match(/w(\d+)d(\d+)/);
  if (m) {
    const hk = `w${m[1]}d${m[2]}`;
    if (!state.history[hk]) state.history[hk] = {};
    const h = state.history[hk];
    const now = Date.now();
    if (!h.startMs) h.startMs = now;
    h.endMs = now;
    h.date = new Date().toISOString().slice(0,10);
  }
  saveState();
}

function getDayExCount(wIdx, dIdx) {
  const day = getDayData(wIdx, dIdx);
  let total = 0, done = 0;
  day.blocks.forEach((bl, bi) => {
    bl.exercises.forEach((_, ei) => {
      total++;
      if (isExDone(exId(wIdx, dIdx, bi, ei))) done++;
    });
  });
  return { total, done };
}

function getWeekProgress(wIdx) {
  let total = 0, done = 0;
  PROGRAM[wIdx].forEach((_, di) => {
    const c = getDayExCount(wIdx, di);
    total += c.total; done += c.done;
  });
  return { total, done };
}

function getTotalProgress() {
  let total = 0, done = 0;
  PROGRAM.forEach((_, wi) => {
    const c = getWeekProgress(wi);
    total += c.total; done += c.done;
  });
  return { total, done };
}

function getPhase(wIdx) { return Math.floor(wIdx / 4); }

// Next incomplete training
function getNextTraining() {
  for (let w = 0; w < 16; w++) {
    for (let d = 0; d < 3; d++) {
      const dc = getDayExCount(w, d);
      if (dc.done < dc.total) return { w, d };
    }
  }
  return null;
}

// Streak: count consecutive completed days (backwards from latest completed)
function getStreak() {
  let streak = 0;
  for (let w = 0; w < 16; w++) {
    for (let d = 0; d < 3; d++) {
      const dc = getDayExCount(w, d);
      if (dc.done === dc.total && dc.total > 0) streak++;
      else return streak;
    }
  }
  return streak;
}

// Hike countdown
function getHikeCountdown() {
  if (!state.hikeDate) return null;
  const diff = Math.ceil((new Date(state.hikeDate + 'T00:00:00') - new Date()) / 86400000);
  return diff;
}

function setHikeDate(v) {
  state.hikeDate = v;
  saveState();
  render();
}

// Notes
function saveDayNotes(w, d) {
  const ta = document.getElementById('dayNotes');
  if (!ta) return;
  const key = `w${w}d${d}`;
  if (ta.value.trim()) state.notes[key] = ta.value.trim();
  else delete state.notes[key];
  saveState();
}

// Week skip
function skipWeek() {
  if (confirm('Пропустить текущую неделю? Программа сдвинется на 1 неделю.')) {
    state.weekOffset = (state.weekOffset || 0) + 1;
    saveState();
    render();
  }
}

// ============ TIMER ============
let timerInterval = null;
let timerEnd = 0;
let timerTotal = 0;

function startTimer(seconds, label) {
  stopTimer();
  timerTotal = seconds;
  timerEnd = Date.now() + seconds * 1000;
  const overlay = document.getElementById('timer');
  const textEl = document.getElementById('timerText');
  const labelEl = document.getElementById('timerLabel');
  const fillEl = document.getElementById('timerProgressFill');
  overlay.classList.add('active');
  labelEl.textContent = label || 'Отдых';

  timerInterval = setInterval(() => {
    const remaining = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
    const mins = Math.floor(remaining / 60);
    const secs = remaining % 60;
    textEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
    fillEl.style.width = `${(remaining / timerTotal) * 100}%`;
    if (remaining <= 0) {
      stopTimer();
      beep();
    }
  }, 200);
}

function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  document.getElementById('timer').classList.remove('active');
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.2, 0.4].forEach(t => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880;
      g.gain.value = 0.3;
      o.start(ctx.currentTime + t);
      o.stop(ctx.currentTime + t + 0.15);
    });
  } catch(e) {}
}

function getExImgId(name) {
  const n = name.toLowerCase();
  for (const [rx, id] of PHOTO_MAP) {
    if (rx.test(n)) return id;
  }
  return null;
}

function getExImgHtml(name) {
  const id = getExImgId(name);
  if (!id) return '<div style="width:40px;height:40px;margin:8px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:1.1rem">&#128170;</div>';
  const url0 = IMG_BASE + id + '/0.jpg';
  const url1 = IMG_BASE + id + '/1.jpg';
  const safeName = name.replace(/'/g, "\\'");
  return `<img src="${url0}" alt="" loading="lazy" data-img0="${url0}" data-img1="${url1}" data-frame="0" onerror="this.style.display='none'" onclick="openLightbox(this,'${safeName}')">`;
}

// Lightbox
let lbState = { img0: '', img1: '', view: 'both' };

function openLightbox(img, title) {
  lbState.img0 = img.dataset.img0;
  lbState.img1 = img.dataset.img1;
  lbState.view = 'both';
  document.getElementById('lbTitle').textContent = title;
  renderLbImgs();
  // Reset toggle buttons
  document.querySelectorAll('#lbToggle button').forEach((b,i) => b.classList.toggle('active', i===0));
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox(e) {
  if (e && e.target !== e.currentTarget && !e.target.classList.contains('lightbox-close')) return;
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}

function showLbView(view) {
  lbState.view = view;
  renderLbImgs();
  document.querySelectorAll('#lbToggle button').forEach(b => {
    b.classList.toggle('active', b.textContent === (view==='both'?'Оба':view==='start'?'Старт':'Финиш'));
  });
}

function renderLbImgs() {
  const c = document.getElementById('lbImgs');
  if (lbState.view === 'both') {
    c.innerHTML = `<img src="${lbState.img0}" alt="Начальная позиция"><img src="${lbState.img1}" alt="Конечная позиция">`;
  } else if (lbState.view === 'start') {
    c.innerHTML = `<img src="${lbState.img0}" alt="Начальная позиция" style="max-width:85%">`;
  } else {
    c.innerHTML = `<img src="${lbState.img1}" alt="Конечная позиция" style="max-width:85%">`;
  }
}

function getExForVenue(ex, venue) {
  if (venue === 'gym') return ex;
  for (const [rx, homeSub, outdoorSub] of VENUE_SUBS) {
    if (rx.test(ex.name)) {
      const s = venue === 'home' ? homeSub : outdoorSub;
      if (!s) return ex;
      let params = s.p ? s.p(ex.params) : ex.params;
      return { name: s.n, params: params, notes: ex.notes };
    }
  }
  return ex;
}

function dayVenueKey(w, d) { return `w${w}d${d}`; }
function getProfileVenue(w, d) {
  const p = PROFILES.find(p => p.id === state.profile);
  return p ? p.venue(w, d) : 'gym';
}
function getDayVenue(w, d) { return state.venues[dayVenueKey(w, d)] || getProfileVenue(w, d); }
function isDayOverridden(w, d) { return !!state.venues[dayVenueKey(w, d)]; }
function setDayVenue(w, d, v) {
  const profileDefault = getProfileVenue(w, d);
  if (v === profileDefault) delete state.venues[dayVenueKey(w, d)];
  else state.venues[dayVenueKey(w, d)] = v;
  saveState();
  render();
}
function setProfile(id) {
  state.profile = id;
  state.venues = {}; // reset per-day overrides
  saveState();
  render();
}

// getDayData: returns {day, isOverride} — for "run" venue, Tue/Sat use RUN_PROGRAM
function getDayData(w, d) {
  const venue = getDayVenue(w, d);
  if (venue === 'run' && RUN_PROGRAM[w] && RUN_PROGRAM[w][d]) {
    const rp = RUN_PROGRAM[w][d];
    return {
      day: PROGRAM[w][d].day,
      focus: rp.focus,
      blocks: rp.blocks,
      isOverride: true
    };
  }
  return { ...PROGRAM[w][d], isOverride: false };
}

// ============ RENDER ============
const app = document.getElementById('app');

function navigate(screen, weekIdx, dayIdx) {
  state.screen = screen;
  if (weekIdx !== undefined) state.weekIdx = weekIdx;
  if (dayIdx !== undefined) state.dayIdx = dayIdx;
  state.openBlocks = {};
  saveState();
  render();
  window.scrollTo(0, 0);
}

function render() {
  if (state.screen === 'program') renderProgram();
  else if (state.screen === 'week') renderWeek();
  else if (state.screen === 'day') renderDay();
}

function renderProgram() {
  const tp = getTotalProgress();
  const pct = tp.total ? Math.round(tp.done / tp.total * 100) : 0;
  let html = `
    <div class="header">
      <h1>&#9968; Горный тренер</h1>
      <div class="header-sub">Подготовка к походу &bull; 16 недель &bull; ${pct}% выполнено${getStreak()>=2?`<span class="streak-badge">&#128293; ${getStreak()} подряд</span>`:''}</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    </div>
  `;

  // Next training widget
  const nt = getNextTraining();
  if (nt) {
    const ntDay = getDayData(nt.w, nt.d);
    const DAYS_S = ['Вт','Чт','Сб'];
    html += `
      <div class="next-train fade-in" onclick="navigate('day',${nt.w},${nt.d})">
        <div class="next-train-label">Следующая тренировка</div>
        <div class="next-train-title">Неделя ${nt.w+1}, ${DAYS_S[nt.d]} &mdash; ${ntDay.focus}</div>
        <div class="next-train-sub">${VENUE_LABELS[getDayVenue(nt.w,nt.d)]} &bull; Нажмите чтобы начать &rarr;</div>
      </div>
    `;
  }

  // Hike countdown
  const hikeDays = getHikeCountdown();
  html += `
    <div class="countdown-wrap">
      <div class="countdown-card">
        <div class="countdown-top">
          <div class="countdown-label">&#9968; Обратный отсчёт до похода</div>
          <div class="countdown-date"><input type="date" value="${state.hikeDate||''}" onchange="setHikeDate(this.value)"></div>
        </div>
        ${hikeDays !== null ? `
          <div class="countdown-num">${hikeDays > 0 ? hikeDays : (hikeDays === 0 ? '&#127881;' : Math.abs(hikeDays))} ${hikeDays > 0 ? (hikeDays===1?'день':hikeDays<5?'дня':'дней') : (hikeDays===0?'Сегодня поход!':'дней назад')}</div>
          ${nt && hikeDays > 0 ? `<div class="countdown-detail">Осталось тренировок: ~${Math.min(hikeDays > 0 ? Math.floor(hikeDays/7)*3+Math.min(hikeDays%7,3) : 0, 48 - tp.done)}</div>` : ''}
        ` : '<div class="countdown-detail" style="margin-top:8px">Укажите дату похода для обратного отсчёта</div>'}
      </div>
    </div>
  `;

  html += `
    <div class="profile-wrap">
      <div class="profile-label">Формат тренировок</div>
      <div class="profile-cards">
        ${PROFILES.map(p => `
          <div class="profile-card ${state.profile===p.id?'active':''}" onclick="setProfile('${p.id}')">
            <div class="pf-icon">${p.icon}</div>
            <div class="pf-info">
              <div class="pf-name">${p.name}</div>
              <div class="pf-desc">${p.desc}</div>
            </div>
            <div class="pf-check">${state.profile===p.id?'✓':''}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  for (let p = 0; p < 4; p++) {
    const phase = PHASES[p];
    // Readiness test before phase
    if (READINESS_TESTS[p]) {
      html += `
        <div class="test-wrap fade-in">
          <div class="test-title">&#9989; Тест готовности к Фазе ${p+1}</div>
          ${READINESS_TESTS[p].map((t,i) => `<div class="test-item"><input type="checkbox" id="rt${p}_${i}"><label for="rt${p}_${i}">${t}</label></div>`).join('')}
          <div class="test-result" style="background:var(--border);color:var(--text-muted)">Отметьте все пункты, если готовы к следующей фазе</div>
        </div>
      `;
    }
    html += `
      <div class="phase-section fade-in">
        <div class="phase-header">
          <div class="phase-dot" style="background:${phase.color}"></div>
          <div class="phase-name">Фаза ${p+1}: ${phase.name}</div>
        </div>
        <div class="phase-desc">${phase.desc}</div>
    `;
    for (let w = p * 4; w < (p + 1) * 4; w++) {
      const wp = getWeekProgress(w);
      const wpct = wp.total ? Math.round(wp.done / wp.total * 100) : 0;
      const isDeload = (w % 4 === 3);
      html += `
        <div class="card" onclick="navigate('week',${w})">
          <div class="card-body">
            <div class="card-top">
              <div class="card-title">Неделя ${w+1}${isDeload ? ' (разгрузка)' : ''}</div>
              <div class="card-badge" style="background:${phase.color}">${wpct}%</div>
            </div>
            <div class="card-meta">${PROGRAM[w].map((_,di) => getDayData(w,di).focus).join(' &bull; ')}</div>
            <div class="card-progress"><div class="card-progress-fill" style="width:${wpct}%;background:${phase.color}"></div></div>
          </div>
        </div>
      `;
    }
    html += `</div>`;
  }

  html += `
    <div class="cal-wrap">
      <div class="cal-date-row">
        <label for="calStart">Дата начала:</label>
        <input type="date" id="calStart" value="${new Date().toISOString().slice(0,10)}">
      </div>
      <button class="cal-btn" onclick="exportCalendar()" style="margin-top:8px">&#128197; Добавить в календарь (48 тренировок)</button>
    </div>
  `;
  html += `<div class="reset-wrap"><button class="reset-btn" onclick="resetProgress()">Сбросить прогресс</button></div>`;
  app.innerHTML = html;
}

function renderWeek() {
  const w = state.weekIdx;
  const phase = PHASES[getPhase(w)];
  const wp = getWeekProgress(w);
  const wpct = wp.total ? Math.round(wp.done / wp.total * 100) : 0;
  const DAYS_FULL = ['Вторник', 'Четверг', 'Суббота'];

  let html = `
    <div class="header">
      <div style="display:flex;align-items:center;gap:4px">
        <button class="back-btn" onclick="navigate('program')">&larr;</button>
        <h1>Неделя ${w+1}</h1>
      </div>
      <div class="header-sub" style="margin-left:32px">${phase.name} &bull; ${wpct}% выполнено</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${wpct}%"></div></div>
    </div>
    <div class="week-nav">
      <button class="week-nav-btn" ${w===0?'disabled':''} onclick="navigate('week',${w-1})">&larr; Нед. ${w}</button>
      <div class="week-nav-title">Неделя ${w+1}/16</div>
      <button class="week-nav-btn" ${w===15?'disabled':''} onclick="navigate('week',${w+1})">Нед. ${w+2} &rarr;</button>
    </div>
    <div class="day-cards">
  `;

  PROGRAM[w].forEach((_, di) => {
    const day = getDayData(w, di);
    const dc = getDayExCount(w, di);
    const dpct = dc.total ? Math.round(dc.done / dc.total * 100) : 0;
    const isDone = dpct === 100;
    const venueIcon = {gym:'',home:'&#127968;',outdoor:'&#127794;',run:'&#127939;'}[getDayVenue(w,di)] || '';
    html += `
      <div class="day-card fade-in" onclick="navigate('day',${w},${di})">
        <div class="day-card-header">
          <div>
            <div class="day-card-day">${DAYS_FULL[di]}${venueIcon?`<span class="venue-badge" style="background:var(--primary-light);color:#fff">${venueIcon}</span>`:''}</div>
            <div class="day-card-focus">${day.focus}</div>
          </div>
          <div class="day-card-status" style="background:${isDone?'var(--success)':'var(--border)'};color:${isDone?'#fff':'var(--text-muted)'}">
            ${isDone ? 'Готово' : `${dc.done}/${dc.total}`}
          </div>
        </div>
        <div class="day-card-exercises">
          ${day.blocks.filter(b=>b.type!=='warmup'&&b.type!=='cooldown').map(b=>b.exercises.length+' упр.').join(' + ')}
        </div>
        <div class="card-progress" style="margin:0 16px 12px"><div class="card-progress-fill" style="width:${dpct}%;background:${phase.color}"></div></div>
      </div>
    `;
  });

  html += `</div>`;
  // Week history summary
  const weekHists = [0,1,2].map(di => state.history[`w${w}d${di}`]).filter(Boolean);
  if (weekHists.length > 0) {
    html += `<div class="history-wrap"><div class="history-title">Выполнено на этой неделе</div>`;
    weekHists.forEach(h => {
      const dur = h.endMs && h.startMs ? Math.round((h.endMs - h.startMs) / 60000) : 0;
      html += `<div class="history-item"><span>${h.date || '—'}</span>${dur > 0 ? `<span>~${dur} мин</span>` : '<span></span>'}</div>`;
    });
    html += `</div>`;
  }
  app.innerHTML = html;
}

        <div class="venue-tab ${venue==='run'?'active':''}" onclick="setDayVenue(${w},${d},'run')"><span class="venue-icon">&#127939;</span>Бег</div>
      </div>
      ${VENUE_EQUIP[venue] ? '<div class="venue-equip">'+VENUE_EQUIP[venue]+'</div>' : ''}
      ${isDayOverridden(w,d) ? '<div class="venue-override">Переопределено для этого дня. Профиль: '+PROFILES.find(p=>p.id===state.profile).name+'</div>' : ''}
    </div>
  `;

  day.blocks.forEach((block, bi) => {
    const blockId = `${w}-${d}-${bi}`;
    const isOpen = state.openBlocks[blockId] !== false; // open by default
    const typeLabel = block.type === 'circuit' ? 'Круг' : block.type === 'sets' ? 'Сет' : block.type === 'warmup' ? 'Разминка' : 'Заминка';
    const roundsInfo = block.rounds > 1 ? `${block.rounds} ${block.type==='circuit'?'кругов':'подходов'}` : '';
    const restInfo = block.rest > 0 ? `отдых ${block.rest >= 60 ? Math.floor(block.rest/60) + ' мин' : block.rest + ' сек'}` : '';
    const meta = [roundsInfo, restInfo].filter(Boolean).join(', ');

    html += `
      <div class="block">
        <div class="block-header" onclick="toggleBlock('${blockId}')">
          <div>
            <div class="block-name">${block.name}</div>
            ${meta ? `<div class="block-info">${meta}</div>` : ''}
          </div>
          <div class="block-chevron ${isOpen?'open':''}">&#9660;</div>
        </div>
        <div class="block-content ${isOpen?'open':''}">
    `;

    block.exercises.forEach((ex, ei) => {
      const effectiveVenue = day.isOverride ? 'gym' : (venue === 'run' ? 'outdoor' : venue);
      const vex = day.isOverride ? ex : getExForVenue(ex, effectiveVenue);
      const eid = exId(w, d, bi, ei);
      const done = isExDone(eid);
      // Detect timed exercises
      const timeMatch = vex.params.match(/^(\d+)\s*(мин|сек)/);
      const exTimerSec = timeMatch ? (timeMatch[2]==='мин' ? parseInt(timeMatch[1])*60 : parseInt(timeMatch[1])) : 0;
      html += `
        <div class="exercise ${done?'done':''}">
          <div class="ex-check ${done?'checked':''}" onclick="toggleExercise('${eid}')"></div>
          <div class="ex-img">${getExImgHtml(vex.name)}</div>
          <div class="ex-body">
            <div class="ex-name">${vex.name}</div>
            ${vex.params ? `<div class="ex-params">${vex.params}</div>` : ''}
            ${vex.notes ? `<div class="ex-notes">${vex.notes}</div>` : ''}
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              ${exTimerSec > 0 ? `<button class="ex-rest-btn" style="background:var(--success)" onclick="startTimer(${exTimerSec},'${vex.name.replace(/'/g,"\\'")}')">&#9654; ${timeMatch[1]} ${timeMatch[2]}</button>` : ''}
              ${block.rest > 0 ? `<button class="ex-rest-btn" onclick="startTimer(${block.rest},'${typeLabel}: отдых')">&#9202; Отдых ${block.rest >= 60 ? Math.floor(block.rest/60)+' мин' : block.rest+' сек'}</button>` : ''}
            </div>
          </div>
        </div>
      `;
    });

    html += `</div></div>`;
  });

  html += `
    <div class="complete-all-wrap">
      <button class="complete-all-btn ${allDone?'undo':'do'}" onclick="toggleAllDay(${w},${d})">
        ${allDone ? 'Снять отметки' : 'Отметить всё выполненным'}
      </button>
    </div>
  `;

  // Notes
  const noteKey = `w${w}d${d}`;
  html += `
    <div class="notes-wrap">
      <div class="notes-label">Заметки (вес, пульс, самочувствие)</div>
      <textarea class="notes-area" id="dayNotes" placeholder="Запишите свои наблюдения..." onblur="saveDayNotes(${w},${d})">${state.notes[noteKey]||''}</textarea>
    </div>
  `;

  // History
  const hist = state.history[noteKey];
  if (hist && hist.date) {
    const dur = hist.endMs && hist.startMs ? Math.round((hist.endMs - hist.startMs) / 60000) : 0;
    html += `
      <div class="history-wrap">
        <div class="history-title">История</div>
        <div class="history-item"><span>Дата</span><span>${hist.date}</span></div>
        ${dur > 0 ? `<div class="history-item"><span>Длительность</span><span>~${dur} мин</span></div>` : ''}
      </div>
    `;
  }

  // day navigation
  html += `
    <div class="week-nav" style="padding-bottom:20px">
      <button class="week-nav-btn" ${d===0?'disabled':''} onclick="navigate('day',${w},${d-1})">&larr; ${d>0?PROGRAM[w][d-1].day:''}</button>
      <div class="week-nav-title">${day.day}</div>
      <button class="week-nav-btn" ${d===2?'disabled':''} onclick="navigate('day',${w},${d+1})">${d<2?PROGRAM[w][d+1].day:''} &rarr;</button>
    </div>
  `;

  app.innerHTML = html;
}

// ============ ACTIONS ============
function toggleBlock(blockId) {
  state.openBlocks[blockId] = state.openBlocks[blockId] === false ? true : false;
  render();
}

function toggleExercise(eid) {
  toggleEx(eid);
  // Minimal re-render: just update this exercise + progress
  render();
}

function toggleAllDay(wIdx, dIdx) {
  const day = getDayData(wIdx, dIdx);
  const dc = getDayExCount(wIdx, dIdx);
  const allDone = dc.done === dc.total;
  day.blocks.forEach((bl, bi) => {
    bl.exercises.forEach((_, ei) => {
      const id = exId(wIdx, dIdx, bi, ei);
      if (allDone) delete state.completed[id];
      else state.completed[id] = true;
    });
  });
  saveState();
  render();
}

function resetProgress() {
  if (confirm('Сбросить весь прогресс тренировок?')) {
    state.completed = {};
    saveState();
    render();
  }
}

// ============ CALENDAR EXPORT ============
function exportCalendar() {
  const input = document.getElementById('calStart');
  if (!input || !input.value) { alert('Выберите дату начала тренировок'); return; }

  const startDate = new Date(input.value + 'T00:00:00');
  // Find the nearest Tuesday (day 2) on or after the selected date
  const dow = startDate.getDay(); // 0=Sun
  const daysToTue = (2 - dow + 7) % 7;
  const firstTue = new Date(startDate);
  firstTue.setDate(firstTue.getDate() + daysToTue);

  const DAY_OFFSETS = [0, 2, 4]; // Tue=0, Thu=+2, Sat=+4
  const HOURS = ['18:00','18:00','10:00']; // default times: Tue 18, Thu 18, Sat 10
  const DURATIONS = [90, 90, 90]; // minutes

  function icsDate(d, time) {
    const [h, m] = time.split(':').map(Number);
    const dt = new Date(d);
    dt.setHours(h, m, 0, 0);
    return dt.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  }

  function icsDateEnd(d, time, dur) {
    const [h, m] = time.split(':').map(Number);
    const dt = new Date(d);
    dt.setHours(h, m + dur, 0, 0);
    return dt.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  }

  let events = '';
  const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

  for (let w = 0; w < 16; w++) {
    for (let di = 0; di < 3; di++) {
      const day = getDayData(w, di);
      const eventDate = new Date(firstTue);
      eventDate.setDate(firstTue.getDate() + w * 7 + DAY_OFFSETS[di]);

      const venue = getDayVenue(w, di);
      const vLabel = VENUE_LABELS[venue] || '';
      const summary = `Тренировка: ${day.focus}`;
      const desc = `Неделя ${w+1}, ${['Вт','Чт','Сб'][di]}\\n${vLabel}\\n\\nБлоки:\\n${day.blocks.map(bl => '- ' + bl.name + ' (' + bl.exercises.length + ' упр.)').join('\\n')}`;

      events += `BEGIN:VEVENT\r\nUID:${uid()}@hiking-trainer\r\nDTSTAMP:${icsDate(new Date(),'00:00')}\r\nDTSTART:${icsDate(eventDate, HOURS[di])}\r\nDTEND:${icsDateEnd(eventDate, HOURS[di], DURATIONS[di])}\r\nSUMMARY:${summary}\r\nDESCRIPTION:${desc}\r\nBEGIN:VALARM\r\nTRIGGER:-PT1H\r\nACTION:DISPLAY\r\nDESCRIPTION:Тренировка через 1 час\r\nEND:VALARM\r\nBEGIN:VALARM\r\nTRIGGER:-PT15M\r\nACTION:DISPLAY\r\nDESCRIPTION:Тренировка через 15 минут\r\nEND:VALARM\r\nEND:VEVENT\r\n`;
    }
  }

  const ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Hiking Trainer//RU\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\nX-WR-CALNAME:Горный тренер\r\n${events}END:VCALENDAR`;

  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hiking-trainer.ics';
  a.click();
  URL.revokeObjectURL(url);
}

// ============ BACK BUTTON ============
window.addEventListener('popstate', () => {
  if (state.screen === 'day') navigate('week', state.weekIdx);
  else if (state.screen === 'week') navigate('program');
});

// Push state on navigation
const origNavigate = navigate;
navigate = function(screen, weekIdx, dayIdx) {
  if (screen !== state.screen || weekIdx !== state.weekIdx || dayIdx !== state.dayIdx) {
    history.pushState(null, '');
  }
  origNavigate(screen, weekIdx, dayIdx);
};

// ============ INIT ============
loadState();
render();

// Mini-animation: toggle exercise images between frame 0 and 1
setInterval(() => {
  document.querySelectorAll('.ex-img img[data-frame]').forEach(img => {
    const f = img.dataset.frame === '0' ? '1' : '0';
    img.dataset.frame = f;
    img.src = f === '0' ? img.dataset.img0 : img.dataset.img1;
  });
}, 1500);

// Register service worker for PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
