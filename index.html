<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#dfe5dc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16211c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Горный тренер">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Горный тренер</title>

</head>
<body>
<div id="app"></div>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <div class="lightbox-title" id="lbTitle"></div>
  <div class="lightbox-imgs" id="lbImgs"></div>
  <div class="lightbox-toggle" id="lbToggle">
    <button class="active" onclick="showLbView('both')">Оба</button>
    <button onclick="showLbView('start')">Старт</button>
    <button onclick="showLbView('end')">Финиш</button>
  </div>
  <div class="lightbox-hint">Две фотографии: начальная и конечная позиция</div>
</div>

<div class="timer-overlay" id="timer">
  <div class="timer-progress"><div class="timer-progress-fill" id="timerProgressFill"></div></div>
  <div class="timer-bar">
    <div>
      <div class="timer-label" id="timerLabel">Отдых</div>
      <div class="timer-text" id="timerText">0:00</div>
    </div>
    <button class="timer-close" onclick="stopTimer()">Стоп</button>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
